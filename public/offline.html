<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#FFFFFF" />
<title>Offline · MakeIt // HQ</title>
<style>
  /* Nord lys (DESIGN.md). Served by the service worker without the app's
     CSS, so the tokens are inlined: paper, ink, 1 px lines, radius 0. */
  :root { color-scheme: light; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; align-items: center;
    background: #FFFFFF; color: #111111;
    font-family: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }
  main { max-width: 420px; }
  .kicker { font-size: 13px; line-height: 1.35; color: #2E4A3B; }
  h1 {
    font-size: 34px; line-height: 1; font-weight: 500; letter-spacing: -0.03em;
    margin: 8px 0 12px;
  }
  p { color: #333333; font-size: 15px; line-height: 1.5; margin: 0 0 8px; }
  .en { color: #5E5E59; font-size: 13px; }
  button {
    margin-top: 24px; height: 48px; padding: 0 20px;
    font: inherit; font-size: 15px; font-weight: 500;
    background: #111111; color: #FFFFFF;
    border: 1px solid #111111; border-radius: 0; cursor: pointer;
  }
  button:focus-visible { outline: 2px solid #111111; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <div class="kicker">MakeIt // HQ</div>
  <h1>Ingen forbindelse.</h1>
  <p>Du er offline. Dine data venter på serveren. Prøv igen, når du har netværk.</p>
  <p class="en">You're offline. Try again when you have a connection.</p>
  <button type="button" onclick="location.reload()">Prøv igen →</button>
</main>
</body>
</html>
