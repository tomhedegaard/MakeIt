<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0A0A0B" />
<title>Offline — MakeIt // HQ</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    background: #0A0A0B; color: #F5F2EC;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding: env(safe-area-inset-top) 24px env(safe-area-inset-bottom);
  }
  main { max-width: 420px; text-align: center; }
  .kicker {
    font-family: ui-monospace, monospace; font-size: 11px; font-weight: 500;
    letter-spacing: 0.18em; text-transform: uppercase; color: #A8A6A0;
  }
  h1 {
    font-size: clamp(2rem, 9vw, 3rem); line-height: 0.95;
    text-transform: uppercase; letter-spacing: -0.02em; margin: 14px 0 12px;
  }
  p { color: #A8A6A0; font-size: 15px; line-height: 1.6; margin: 0 0 8px; }
  .en { color: #56554F; font-size: 13px; }
  button {
    margin-top: 28px; height: 44px; padding: 0 22px;
    font-family: ui-monospace, monospace; font-size: 12px; font-weight: 500;
    letter-spacing: 0.14em; text-transform: uppercase;
    background: #F5F2EC; color: #0A0A0B;
    border: 1px solid #F5F2EC; border-radius: 999px; cursor: pointer;
  }
  button:active { opacity: 0.8; }
</style>
</head>
<body>
<main>
  <div class="kicker">MakeIt // HQ</div>
  <h1>Ingen forbindelse</h1>
  <p>Du er offline. Dine data venter på serveren — prøv igen, når du har netværk.</p>
  <p class="en">You're offline. Try again when you have a connection.</p>
  <button onclick="location.reload()">Prøv igen →</button>
</main>
</body>
</html>
